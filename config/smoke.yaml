# Fast CPU-only integration check; not for model quality or final comparison.
seed: 42
data_dir: data/raw
artifact_dir: artifacts/smoke
image_size: 64
batch_size: 8
num_workers: 0
epochs: 1
learning_rate: 0.001
weight_decay: 0.0001
validation_fraction: 0.2
test_fraction: 0.2
model: custom_cnn
pretrained: true
freeze_backbone_epochs: 0
class_weighted_loss: true
max_samples_per_class: 10
device: cpu
