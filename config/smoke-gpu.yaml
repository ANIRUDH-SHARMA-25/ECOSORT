# Fast CUDA integration check; not for model-quality comparison or final training.
seed: 42
data_dir: data/raw
artifact_dir: artifacts/smoke-gpu
image_size: 64
batch_size: 16
num_workers: 0
epochs: 1
learning_rate: 0.001
weight_decay: 0.0001
